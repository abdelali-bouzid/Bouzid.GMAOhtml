const $ = id =>

const esc = s =>

const isAdmin = () =>

const today = () =>

const days = (a,b) =>

const save = () =>

const inP = d =>

    (!kp.to || d <= kp.to);


const I =

/* =========================================================

             * EQ-002
             */

            equipements:[

                {
                    code:'EQ-001',
                    name:'Presse Hydraulique 01',

                }

            ],


            /*
             * Les sous-équipements utilisent
             * également un code automatique.

            pannes:[],

                    image:'',

                    min:2
                }

}


/* =========================================================
   NORMALISATION DES DONNÉES
========================================================= */

function norm(p){

    [
        'zones',
        'equipements',
        'subEquipements',
        'techniciens',
        'di',
        'planning',
        'pannes',
        'stock'

    ].forEach(
        k => p[k] ??= []
    );


    /*
     * Compatibilité avec les anciennes données :
     *
     * Si un équipement existant n'a pas de code,
     * on lui attribue automatiquement un EQ.
     */

    let eqCounter = 0;

    p.equipements.forEach(e => {

        if(!e.code){

            eqCounter++;

            e.code =
                'EQ-' +
                String(eqCounter)
                    .padStart(3,'0');

        }

    });


    /*
     * Recherche du numéro EQ le plus élevé.
     */

    const maxEQ =
        Math.max(
            0,
            ...p.equipements.map(
                e =>
                    parseInt(
                        String(e.code || '')
                            .replace(/\D/g,'')
                    ) || 0
            )
        );


    /*
     * Si plusieurs anciens équipements
     * possèdent déjà des codes, on continue
     * après le plus grand numéro.
     */

    eqCounter = maxEQ;


    /*
     * Compatibilité sous-équipements.
     */

    let seCounter = 0;

    p.subEquipements.forEach(s => {

        if(!s.code){

            seCounter++;

            s.code =
                'SE-' +
                String(seCounter)
                    .padStart(3,'0');

        }

    });


    const maxSE =
        Math.max(
            0,
            ...p.subEquipements.map(
                s =>
                    parseInt(
                        String(s.code || '')
                            .replace(/\D/g,'')
                    ) || 0
            )
        );


    seCounter = maxSE;


    /*
     * Compatibilité DI / OT.
     */

    let n =
        Math.max(
            0,
            ...p.di.map(
                d =>
                    +String(
                        d.id || ''
                    ).slice(3) || 0
            )
        );


    p.di.forEach(d => {

        if(!d.id){

            n++;

            d.id =
                'OT-' +
                String(n)
                    .padStart(4,'0');

        }

    });

}


/* =========================================================
   CHARGEMENT DE LA BASE LOCALE
========================================================= */

function loadDB(){

    let d;

    try{

        d =
            JSON.parse(
                localStorage.getItem(KEY)
            );

    }catch(e){}


    db =
        d &&
        Object.keys(d).length
            ? d
            : defaultDB();


    Object.values(db)
        .forEach(norm);


    cur =
        Object.keys(db)[0];


    save();

}


/* =========================================================
   GÉNÉRATION AUTOMATIQUE DES CODES
========================================================= */

/*
 * Génère le prochain code équipement.
 *
 * EQ-001
 * EQ-002
 * EQ-003
 * ...
 */

function nextEquipmentCode(){

    const list =
        P().equipements || [];


    const max =
        Math.max(
            0,
            ...list.map(e => {

                const n =
                    parseInt(
                        String(e.code || '')
                            .match(/\d+/)?.[0]
                    );

                return Number.isFinite(n)
                    ? n
                    : 0;

            })
        );


    return (
        'EQ-' +
        String(max + 1)
            .padStart(3,'0')
    );

}


/*
 * Génère le prochain code sous-équipement.
 *
 * SE-001
 * SE-002
 * SE-003
 * ...
 */

function nextSubEquipmentCode(){

    const list =
        P().subEquipements || [];


    const max =
        Math.max(
            0,
            ...list.map(s => {

                const n =
                    parseInt(
                        String(s.code || '')
                            .match(/\d+/)?.[0]
                    );

                return Number.isFinite(n)
                    ? n
                    : 0;

            })
        );


    return (
        'SE-' +
        String(max + 1)
            .padStart(3,'0')
    );

}


/*
 * Génération OT existante.
 */

const nextId = () =>
    'OT-' +
    String(
        Math.max(
            0,
            ...P().di.map(
                d =>
                    +String(d.id)
                        .slice(3) || 0
            )
        ) + 1
    ).padStart(4,'0');


const di = id =>
    P().di.find(
        d => d.id === id
    );


/* =========================================================
   AUTHENTIFICATION
========================================================= */

const sha = async t =>
    [
        ...new Uint8Array(
            await crypto.subtle.digest(
                'SHA-256',
                new TextEncoder().encode(t)
            )
        )
    ]
    .map(
        x =>
            x.toString(16)
             .padStart(2,'0')
    )
    .join('');


const users = () => {

    try{

        const u =
            JSON.parse(
                localStorage.getItem(UKEY)
            );

        if(u && u.length)
            return u;

    }catch(e){}


    try{

        const o =
            JSON.parse(
                localStorage.getItem(
                    'GMAO_PRO_AUTH'
                )
            );

        if(o)
            return [
                {
                    ...o,
                    role:'admin'
                }
            ];

    }catch(e){}


    return [];

};


const saveUsers = u =>
    localStorage.setItem(
        UKEY,
        JSON.stringify(u)
    );


const mk = async (
    user,
    pass,
    role
) => {

    const salt =
        crypto.randomUUID();


    return {

        user,

        salt,

        hash:
            await sha(
                salt + pass
            ),

        role

    };

};


const amsg = m => {

    $('am').textContent = m;

    $('am')
        .classList
        .remove('hidden');

};


let fails = 0;
let lock = 0;


/* =========================================================
   INITIALISATION AUTH
========================================================= */

function initAuth(){

    if(!users().length){

        $('cw')
            .classList
            .remove('hidden');

        $('lc').required = true;

        $('ab').textContent =
            'Créer le compte administrateur';

    }

}


/* =========================================================
   CONNEXION
========================================================= */

async function login(e){

    e.preventDefault();


    if(Date.now() < lock){

        return amsg(
            'Trop d\'essais. Patientez 30 secondes.'
        );

    }


    const u =
        $('lu')
            .value
            .trim();


    const p =
        $('lp')
            .value;


    const us =
        users();


    /*
     * Première connexion :
     * création du compte administrateur.
     */

    if(!us.length){

        if(p.length < 6)

            return amsg(
                'Mot de passe : 6 caractères minimum.'
            );


        if(
            p !==
            $('lc').value
        )

            return amsg(
                'Les mots de passe ne correspondent pas.'
            );


        me =
            await mk(
                u,
                p,
                'admin'
            );


        saveUsers([
            me
        ]);

    }

    else{

        const a =
            us.find(
                x =>
                    x.user
                        .toLowerCase()
                    ===
                    u.toLowerCase()
            );


        if(
            !a ||
            await sha(
                a.salt + p
            ) !== a.hash
        ){

            if(++fails >= 5){

                lock =
                    Date.now() + 30000;

                fails = 0;

            }


            return amsg(
                'Identifiant ou mot de passe incorrect.'
            );

        }


        me = a;

        fails = 0;

    }


    $('lp').value = '';
    $('lc').value = '';

    $('am')
        .classList
        .add('hidden');


    $('auth')
        .classList
        .add('hidden');


    $('app')
        .classList
        .remove('hidden');


    loadDB();

    tab = 'dash';

    render();

}


/* =========================================================
   DÉCONNEXION
========================================================= */

function logout(){

    me = null;
    db = null;

    $('lp').value = '';

    $('app')
        .classList
        .add('hidden');

    $('auth')
        .classList
        .remove('hidden');

    $('view').innerHTML = '';

}


/* =========================================================
   CHANGEMENT MOT DE PASSE
========================================================= */

function myPw(){

    form(
        'Changer mon mot de passe',

        [
            {
                n:'o',
                l:'Ancien mot de passe',
                t:'password',
                r:1
            },

            {
                n:'n',
                l:'Nouveau (6 min.)',
                t:'password',
                r:1
            },

            {
                n:'c',
                l:'Confirmer',
                t:'password',
                r:1
            }

        ],

        async d => {

            const us =
                users();

            const a =
                us.find(
                    x =>
                        x.user === me.user
                );


            if(
                await sha(
                    a.salt + d.o
                ) !== a.hash
            )

                return
                    'Ancien mot de passe incorrect.';


            if(d.n.length < 6)

                return
                    'Mot de passe trop court.';


            if(d.n !== d.c)

                return
                    'La confirmation ne correspond pas.';


            const n =
                await mk(
                    a.user,
                    d.n,
                    a.role
                );


            Object.assign(
                a,
                n
            );


            saveUsers(us);

            me = a;

            return null;

        }

    );

}


/* =========================================================
   UTILISATEURS
========================================================= */

const admins =
    us =>
        us.filter(
            x =>
                x.role === 'admin'
        ).length;


function addUser(){

    form(
        'Nouvel utilisateur',

        [
            {
                n:'user',
                l:'Identifiant',
                r:1
            },

            {
                n:'pw',
                l:'Mot de passe (6 min.)',
                t:'password',
                r:1
            },

            {
                n:'role',
                l:'Rôle',
                t:'select',
                o:[
                    [
                        'tech',
                        'Technicien'
                    ],
                    [
                        'admin',
                        'Administrateur'
                    ]
                ]
            }

        ],

        async d => {

            const u =
                users();


            if(
                d.pw.length < 6
            )

                return
                    'Mot de passe trop court.';


            if(
                u.some(
                    x =>
                        x.user
                            .toLowerCase()
                        ===
                        d.user
                            .toLowerCase()
                )
            )

                return
                    'Identifiant déjà utilisé.';


            u.push(
                await mk(
                    d.user.trim(),
                    d.pw,
                    d.role
                )
            );


            saveUsers(u);

        }

    );

}


function setRole(i,r){

    const u =
        users();


    if(
        u[i].role === 'admin' &&
        r !== 'admin' &&
        admins(u) < 2
    ){

        alert(
            'Il faut au moins un administrateur.'
        );

        return render();

    }


    u[i].role = r;

    saveUsers(u);

    render();

}


function resetPw(i){

    form(
        'Nouveau mot de passe',

        [
            {
                n:'n',
                l:'Nouveau mot de passe (6 min.)',
                t:'password',
                r:1
            }
        ],

        async d => {

            if(d.n.length < 6)

                return
                    'Mot de passe trop court.';


            const u =
                users();


            Object.assign(
                u[i],
                await mk(
                    u[i].user,
                    d.n,
                    u[i].role
                )
            );


            saveUsers(u);

            return null;

        }

    );

}


function delUser(i){

    const u =
        users();


    if(
        u[i].user === me.user
    )

        return alert(
            'Vous ne pouvez pas supprimer votre propre compte.'
        );


    if(
        !confirm(
            'Supprimer ' +
            u[i].user +
            ' ?'
        )
    )

        return;


    u.splice(i,1);

    saveUsers(u);

    render();

}


/* =========================================================
   ARRIÈRE-PLAN
========================================================= */

function applyBg(){

    let b = '';

    try{

        b =
            localStorage.getItem(BGK)
            || '';

    }catch(e){}


    if(b){

        document.body.style.setProperty(
            '--bg',
            'url("' + b + '")'
        );

        document.body.classList.add(
            'has-bg'
        );

    }

    else{

        document.body.classList.remove(
            'has-bg'
        );

    }

}


function setBg(e){

    const f =
        e.target.files[0];


    if(!f)
        return;


    const u =
        URL.createObjectURL(f);


    const im =
        new Image();


    im.onload = () => {

        const r =
            Math.min(
                1,
                1600 / im.width
            );


        const c =
            document.createElement(
                'canvas'
            );


        c.width =
            im.width * r;


        c.height =
            im.height * r;


        c.getContext('2d')
            .drawImage(
                im,
                0,
                0,
                c.width,
                c.height
            );


        try{

            localStorage.setItem(
                BGK,
                c.toDataURL(
                    'image/jpeg',
                    .7
                )
            );

        }catch(x){

            alert(
                'Image trop lourde.'
            );

        }


        URL.revokeObjectURL(u);

        applyBg();

    };


    im.src = u;

    e.target.value = '';

}


function resetBg(){

    localStorage.removeItem(BGK);

    applyBg();
