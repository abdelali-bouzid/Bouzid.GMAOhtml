<script>
    // 1. إعداد اتصال Supabase الخاص بك
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. التحقق الفوري بمجرد فتح الصفحة (قفل الأمان الإجباري)
    window.addEventListener('DOMContentLoaded', async () => {
        // إظهار شاشة الدخول أولاً كوضع افتراضي آمن
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');

        // التحقق مما إذا كان هناك مستخدم مسجل مسبقاً على هذا المتصفح
        const { data: { session } } = await supabaseClient.auth.getSession();
        
        if (session && session.user) {
            // التحقق الإضافي الصارم من أن البريد هو حسابك حصرياً
            if (session.user.email === "abdelali.bouzid.98@gmail.com") {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                updateCompanyDropdown();
                refreshAll();
            } else {
                // إذا كان بريداً آخر، يتم تسجيل خروجه فوراً وإبقاء التطبيق مقفلاً
                await supabaseClient.auth.signOut();
            }
        }
    });

    // 3. دالة تسجيل الدخول عبر Supabase
    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const errorDiv = document.getElementById('loginError');

        // قند إضافي صارم للبريد
        if (email !== "abdelali.bouzid.98@gmail.com") {
            errorDiv.innerText = "Accès refusé : Cet email n'est pas autorisé.";
            errorDiv.classList.remove('hidden');
            return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            errorDiv.innerText = "Accès refusé : Identifiant ou mot de passe incorrect.";
            errorDiv.classList.remove('hidden');
        } else {
            errorDiv.classList.add('hidden');
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            updateCompanyDropdown();
            refreshAll();
        }
    }

    // 4. دالة تسجيل الخروج الآمن
    async function handleLogout() {
        await supabaseClient.auth.signOut();
        document.getElementById('app-screen').classList.add('hidden');
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('loginPassword').value = '';
    }
</script>
