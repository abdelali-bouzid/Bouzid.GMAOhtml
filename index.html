<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMAO - Système de Gestion de Maintenance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- ================= 1. ÉCRAN DE CONNEXION SÉCURISÉ ================= -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 to-gray-900 px-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8 space-y-6">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-gray-800">Accès Sécurisé - GMAO</h1>
                <p class="text-sm text-gray-500 mt-1">Jbel Annour - Maintenance</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Adresse E-mail</label>
                    <input type="email" id="loginEmail" required 
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" 
                        value="abdelali.bouzid.98@gmail.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
                    <input type="password" id="loginPassword" required 
                        class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" 
                        placeholder="••••••••">
                </div>

                <div id="loginError" class="hidden p-3 text-sm text-red-700 bg-red-100 rounded-lg"></div>

                <button type="submit" 
                    class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
                    Se connecter
                </button>
            </form>
        </div>
    </div>

    <!-- ================= 2. ÉCRAN PRINCIPAL DE L'APPLICATION (TOUTES VOS DONNÉES) ================= -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Barre de navigation -->
        <header class="bg-blue-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <span class="text-xl font-bold">GMAO - Jbel Annour</span>
                    <select id="companyDropdown" class="bg-blue-800 text-white text-sm px-3 py-1 rounded border border-blue-700">
                        <option>Jbel Annour - Maintenance</option>
                    </select>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-gray-200">Abdelali Bouzid (Technicien Méthodes)</span>
                    <button onclick="handleLogout()" 
                        class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-sm transition duration-200 shadow">
                        Déconnexion
                    </button>
                </div>
            </div>
        </header>

        <!-- Contenu et Tableaux du Système de Maintenance -->
        <main class="flex-grow max-w-7xl w-full mx-auto p-6 space-y-6">
            
            <!-- Statistiques / Cartes Rapides -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-blue-600">
                    <h3 class="text-gray-500 text-sm font-medium">Interventions en Cours</h3>
                    <p id="stat-pending" class="text-3xl font-bold text-gray-800 mt-2">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-green-600">
                    <h3 class="text-gray-500 text-sm font-medium">Équipements Actifs</h3>
                    <p id="stat-equipments" class="text-3xl font-bold text-gray-800 mt-2">0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow border-l-4 border-yellow-600">
                    <h3 class="text-gray-500 text-sm font-medium">Pièces en Stock</h3>
                    <p id="stat-stock" class="text-3xl font-bold text-gray-800 mt-2">0</p>
                </div>
            </div>

            <!-- Section des Tableaux de Gestion (GMAO) -->
            <div class="bg-white rounded-xl shadow p-6 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-800">Gestion des Équipements et Interventions</h2>
                    <div class="space-x-2">
                        <button onclick="addNewItem()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm transition">
                            + Ajouter un élément
                        </button>
                        <button onclick="refreshAll()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg text-sm transition">
                            Actualiser
                        </button>
                    </div>
                </div>

                <!-- جدول البيانات الرئيسي -->
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID / Code</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Désignation Équipement</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type de Maintenance</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="gmaoTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- سيتم تعبئة البيانات هنا تلقائياً -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- ================= SCRIPTS ET LOGIQUE DU SYSTÈME ================= -->
    <script>
        // التحقق عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const localAuth = localStorage.getItem('gmao_logged');
            if (localAuth === 'true') {
                openApp();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        // دالة تسجيل الدخول
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (email !== "abdelali.bouzid.98@gmail.com") {
                errorDiv.innerText = "Accès refusé : Cet e-mail n'est pas autorisé.";
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password === "abdelali@98") {
                errorDiv.classList.add('hidden');
                localStorage.setItem('gmao_logged', 'true');
                openApp();
            } else {
                errorDiv.innerText = "Mot de passe incorrect.";
                errorDiv.classList.remove('hidden');
            }
        }

        // فتح واجهة التطبيق واسترجاع المعطيات
        function openApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            refreshAll();
        }

        // تسجيل الخروج
        function handleLogout() {
            localStorage.removeItem('gmao_logged');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('loginPassword').value = '';
        }

        // تحديث وعرض البيانات (الجداول والإحصائيات)
        function refreshAll() {
            // بيانات تجريبية افتراضية للمتابعة (يمكنك ربطها لاحقاً بقاعدة بياناتك السابقة)
            const sampleData = [
                { id: "EQ-001", name: "Ligne d'embouteillage - Moteur Principal", type: "Préventive", status: "Opérationnel" },
                { id: "EQ-002", name: "Compresseur d'air Atlas Copco", type: "Curative", status: "En attente de pièces" },
                { id: "EQ-003", name: "Tapis transporteur N°3", type: "Améliorative", status: "En maintenance" }
            ];

            const tbody = document.getElementById('gmaoTableBody');
            tbody.innerHTML = '';

            sampleData.forEach(item => {
                let statusColor = item.status === 'Opérationnel' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                tbody.innerHTML += `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${item.id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${item.type}</td>
                        <td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">${item.status}</span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                            <button onclick="alert('Détails de l\'équipement ${item.id}')" class="text-blue-600 hover:text-blue-900">Consulter</button>
                        </td>
                    </tr>
                `;
            });

            // تحديث الإحصائيات
            document.getElementById('stat-pending').innerText = "2";
            document.getElementById('stat-equipments').innerText = "14";
            document.getElementById('stat-stock').innerText = "48";
        }

        function addNewItem() {
            alert("Fonctionnalité d'ajout d'un nouvel équipement ou intervention.");
        }
    </script>
</body>
</html>
